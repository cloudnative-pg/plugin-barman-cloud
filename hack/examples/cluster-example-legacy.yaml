apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-example
spec:
  instances: 3

  backup:
    barmanObjectStore:
      endpointCA:
        name: object-store-tls
        key: tls.crt
      destinationPath: s3://backups/
      endpointURL: https://object-store:9000
      s3Credentials:
        accessKeyId:
          name: object-store
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: object-store
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        additionalCommandArgs:
          - "--min-chunk-size=5MB"
          - "--read-timeout=60"
          - "-vv"

  storage:
    size: 1Gi
