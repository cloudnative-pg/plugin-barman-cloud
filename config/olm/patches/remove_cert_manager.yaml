# An OLM bundle can't carry cert-manager resources. Users create the TLS
# certificates themselves (see the CSV description).
$patch: delete
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-server
---
$patch: delete
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client
---
$patch: delete
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
