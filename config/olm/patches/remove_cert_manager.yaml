# An OLM bundle can't contain cert-manager resources. The user creates the
# plugin TLS secrets after installing (see the CSV description).
$patch: delete
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
---
$patch: delete
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-server
---
$patch: delete
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: barman-cloud-client
